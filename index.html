<div class="stat-grid">
  <button class="stat-btn btn-tackle" onclick="increment('tackle',this)">
    <span class="btn-label">Tackle Made</span>
    <span class="btn-count" id="cnt-tackle">0</span>
    <span class="minus-zone" onclick="decrement(event,'tackle')">−</span>
  </button>

  <button class="stat-btn btn-miss" onclick="increment('miss_tackle',this)">
    <span class="btn-label">Missed Tackle</span>
    <span class="btn-count" id="cnt-miss_tackle">0</span>
    <span class="minus-zone" onclick="decrement(event,'miss_tackle')">−</span>
  </button>

  <button class="stat-btn btn-counter" onclick="increment('counter_ruck',this)">
    <span class="btn-label">Counter Ruck Won</span>
    <span class="btn-count" id="cnt-counter_ruck">0</span>
    <span class="minus-zone" onclick="decrement(event,'counter_ruck')">−</span>
  </button>

  <button class="stat-btn btn-ruck" onclick="increment('ruck_won',this)">
    <span class="btn-label">Ruck Won</span>
    <span class="btn-count" id="cnt-ruck_won">0</span>
    <span class="minus-zone" onclick="decrement(event,'ruck_won')">−</span>
  </button>

  <button class="stat-btn btn-breakdown" onclick="increment('first_breakdown',this)">
    <span class="btn-label">First to Breakdown</span>
    <span class="btn-count" id="cnt-first_breakdown">0</span>
    <span class="minus-zone" onclick="decrement(event,'first_breakdown')">−</span>
  </button>

  <button class="stat-btn btn-try" onclick="increment('try',this)">
    <span class="btn-label">Try</span>
    <span class="btn-count" id="cnt-try">0</span>
    <span class="minus-zone" onclick="decrement(event,'try')">−</span>
  </button>

  <button class="stat-btn btn-trysetup" onclick="increment('try_setup',this)">
    <span class="btn-label">Try Set Up</span>
    <span class="btn-count" id="cnt-try_setup">0</span>
    <span class="minus-zone" onclick="decrement(event,'try_setup')">−</span>
  </button>

  <button class="stat-btn btn-pass" onclick="increment('completed_pass',this)">
    <span class="btn-label">Completed Pass</span>
    <span class="btn-count" id="cnt-completed_pass">0</span>
    <span class="minus-zone" onclick="decrement(event,'completed_pass')">−</span>
  </button>

  <button class="stat-btn btn-misspass wide" onclick="increment('missed_pass',this)">
    <span class="btn-label">Missed Pass</span>
    <span class="btn-count" id="cnt-missed_pass">0</span>
    <span class="minus-zone" onclick="decrement(event,'missed_pass')">−</span>
  </button>
</div>
